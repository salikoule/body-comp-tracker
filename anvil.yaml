allow_embedding: false
db_schema:
  dexa_scans:
    client: none
    columns:
    - {name: user, target: users, type: link_single}
    - {name: measured_on, type: date}
    - {name: week_index, type: number}
    - {name: bf_percent, type: number}
    - {name: ffm_kg, type: number}
    - {name: rmr_kcal, type: number}
    - {name: file, type: media}
    - {name: extracted_json, type: string}
    - {name: notes, type: string}
    server: full
    title: DEXA scans
  profiles:
    client: none
    columns:
    - {name: user, target: users, type: link_single}
    - {name: sex, type: string}
    - {name: date_of_birth, type: date}
    - {name: height_cm, type: number}
    - {name: start_weight_kg, type: number}
    - {name: waist_cm, type: number}
    - {name: neck_cm, type: number}
    - {name: hip_cm, type: number}
    - {name: training_days, type: number}
    - {name: daily_steps, type: number}
    - {name: start_date, type: date}
    - {name: outcome, type: string}
    - {name: chain_gain, type: bool}
    - {name: phase, type: string}
    - {name: calories, type: number}
    - {name: protein_g, type: number}
    - {name: fat_g, type: number}
    - {name: carbs_g, type: number}
    - {name: reason, type: string}
    - {name: bf_percent, type: number}
    - {name: target_bf_percent, type: number}
    - {name: target_weight_kg, type: number}
    - {name: forecast_end, type: date}
    - {name: phases_json, type: string}
    - {name: series_json, type: string}
    - {name: coach_state_json, type: string}
    - {name: dexa_bf_percent, type: number}
    - {name: dexa_ffm_kg, type: number}
    - {name: dexa_rmr_kcal, type: number}
    - {name: dexa_measured_on, type: date}
    server: full
    title: Profiles
  users:
    client: none
    columns:
    - {name: email, type: string}
    - {name: enabled, type: bool}
    - {name: last_login, type: datetime}
    - {name: role, type: string}
    - {name: confirmed_email, type: bool}
    - {name: signed_up, type: datetime}
    - {name: password_hash, type: string}
    - {name: n_password_failures, type: number}
    - admin_ui: {order: 8, width: 200}
      client_hidden: true
      name: remembered_logins
      type: simpleObject
    server: full
    title: Users
  week_logs:
    client: none
    columns:
    - {name: user, target: users, type: link_single}
    - {name: week_index, type: number}
    - {name: check_in_date, type: date}
    - {name: avg_weight_kg, type: number}
    - {name: waist_cm, type: number}
    - {name: neck_cm, type: number}
    - {name: bf_percent, type: number}
    - {name: training_sessions, type: number}
    - {name: daily_steps, type: number}
    - {name: training_feel, type: string}
    - {name: adherence, type: string}
    - {name: trend_rate_kg, type: number}
    - {name: status, type: string}
    - {name: notes, type: string}
    - {name: next_calories, type: number}
    - {name: adjustment_reason, type: string}
    server: full
    title: Week logs
  weight_logs:
    client: none
    columns:
    - {name: user, target: users, type: link_single}
    - {name: logged_on, type: date}
    - {name: weight_kg, type: number}
    server: full
    title: Weight logs
dependencies:
- dep_id: dep_r1gjp7ay80bem
  resolution_hints: {app_id: ST3GINETRT4QJYDC, name: craftify-library, package_name: craftify_library}
  version: {branch: master}
- dep_id: dep_3cbnzlajrrq4tg
  resolution_hints: {app_id: 3PIDO5P3H4VPEMPL, name: routing, package_name: routing}
  version: {version_tag: v0.7.0}
metadata: {description: Body composition coach (Anvil + craftify-library)., title: Body Composition Tracker}
name: body-comp-tracker
native_deps:
  head_html: |
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="_/theme/echarts_theme.js"></script>
    <script>
    (function () {
      try {
        var stored = localStorage.getItem("craftify-theme") || "light";
        var dark = stored === "dark" || (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("ipac-dark", dark);
        document.documentElement.classList.toggle("craftify-theme-dark", dark);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) {}
    })();
    </script>
    <link rel="stylesheet" href="_/theme/craftify-full-theme.css">
    <link rel="stylesheet" href="_/theme/tabulator_styles.css">
    <link rel="stylesheet" href="_/theme/coach.css">
    <link rel="stylesheet" href="_/theme/craftify-theme.css">
package_name: body_comp_tracker
runtime_options:
  client_version: '3'
  server_spec: {base: python312}
  version: 3
secrets:
  OPENAI_API_KEY:
    type: secret
    value:
      LFRKA4SPKEL5KGXB: {? '' : }
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_remember_me: true, allow_signup: true, confirm_email: false, enable_automatic_sign_in: true, remember_me_days: 30, use_email: true, use_google: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/anvil/secrets.yml
startup: {module: startup, type: module}
startup_form: null
