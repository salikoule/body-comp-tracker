<anvil-form container="ColumnPanel" prop:spacing="none">
    <anvil-component type="Label" name="kicker" prop:role="coach-kicker" prop:text="Track" container:full_width_row="true"></anvil-component>
    <anvil-component type="Label" name="title" prop:role="coach-title" prop:text="Weekly tracker" container:full_width_row="true"></anvil-component>
    <anvil-component type="Label" name="intro" prop:role="coach-help" prop:text="Every week of the plan. The current week is marked." container:full_width_row="true"></anvil-component>
    <anvil-component type="ColumnPanel" name="body" prop:role="coach-card" prop:spacing="none" container:full_width_row="true"></anvil-component>
</anvil-form>
